<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Resizer & Background Remover</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Image Resizer & Background Remover</h1>
        
        <div class="upload-section">
            <label for="imageInput" class="upload-btn">
                <span>📁 Choose Image</span>
                <input type="file" id="imageInput" accept="image/*" hidden>
            </label>
        </div>

        <div class="controls-section" id="controlsSection" style="display: none;">
            <div class="resize-controls">
                <h2>Resize Image</h2>
                <div class="control-group">
                    <label for="widthInput">Width (px):</label>
                    <input type="number" id="widthInput" min="1" placeholder="Auto">
                </div>
                <div class="control-group">
                    <label for="heightInput">Height (px):</label>
                    <input type="number" id="heightInput" min="1" placeholder="Auto">
                </div>
                <div class="control-group">
                    <label>
                        <input type="checkbox" id="maintainAspectRatio" checked>
                        Maintain Aspect Ratio
                    </label>
                </div>
                <button id="resizeBtn" class="action-btn">Resize</button>
            </div>

            <div class="background-controls">
                <h2>Background Removal</h2>
                <div class="control-group">
                    <label for="thresholdInput">Sensitivity:</label>
                    <input type="range" id="thresholdInput" min="0" max="100" value="30">
                    <span id="thresholdValue">30</span>
                </div>
                <button id="removeBgBtn" class="action-btn">Remove Background</button>
            </div>

            <div class="action-buttons">
                <button id="resetBtn" class="action-btn secondary">Reset</button>
                <button id="saveBtn" class="action-btn primary">Save Image</button>
            </div>
        </div>

        <div class="preview-section">
            <div class="canvas-container">
                <canvas id="imageCanvas"></canvas>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
